name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check sentinel apps scripts tests
      - name: Generate test videos
        run: python scripts/generate_test_videos.py --out datasets/videos
      - name: Test
        run: pytest -q
      - name: Benchmark (smoke)
        run: python scripts/run_benchmark.py --dataset datasets/manifests/eval.yaml --config configs/development.yaml
