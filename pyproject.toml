[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-platform"
version = "0.1.0"
description = "Edge-capable video-intelligence platform for industrial safety events"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sentinel Platform" }]

dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "SQLAlchemy>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Model perception (optional; the core runs without these)
perception = ["ultralytics>=8.2"]
# Infrastructure clients
infra = [
    "redis>=5.0",
    "minio>=7.2",
    "prometheus-client>=0.20",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
tracking = ["mlflow>=2.12"]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
sentinel-benchmark = "scripts.run_benchmark:main"
sentinel-gen-videos = "scripts.generate_test_videos:main"

[tool.setuptools.packages.find]
include = ["sentinel*", "scripts*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP042"]  # FastAPI Depends() defaults; line length handled by formatter; keep (str, Enum)

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
