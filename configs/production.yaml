# Production configuration for the Sentinel platform.
environment: production

logging:
  level: INFO
  json: true

video:
  decode_fps: 15
  reconnect_seconds: 5
  ring_buffer_seconds: 20

detector:
  backend: ultralytics
  model: yolov8m.pt
  confidence: 0.35
  inference_fps: 5
  classes: [person, forklift, car, truck]
  # Stock COCO weights have no "forklift" class. Map the closest COCO vehicle
  # classes onto the platform vocabulary so the proximity/collision rules work
  # out of the box; replace with fine-tuned weights for higher precision.
  class_map:
    truck: forklift
    bus: forklift
  # Higher inference resolution improves recall on small/distant objects.
  imgsz: 960

tracker:
  backend: bytetrack
  update_fps: 15
  max_age_frames: 45
  min_hits: 3
  iou_threshold: 0.3
  max_tracking_gap_seconds: 1.5

event_engine:
  update_fps: 15
  default_cooldown_seconds: 30

storage:
  database_url: null
  sqlite_path: /var/lib/sentinel/sentinel.db
  object_store_local_path: /var/lib/sentinel/object-store

evaluation:
  temporal_iou_threshold: 0.3
